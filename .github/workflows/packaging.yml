name: Package Java Application

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Calculate semantic version based on commit history
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)|(!:)|(BREAKING CHANGE:)"
          minor_pattern: "(MINOR)|(feat:)|(feat\\(.*\\):)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Log Version
        run: echo "Target release version is ${{ steps.semver.outputs.version }}"

  build-linux:
    needs: get-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Project Version
        run: mvn versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false

      - name: Build with Maven and prepare dependencies
        run: |
          mvn clean package -DskipTests
          mkdir -p target/package-input
          cp target/FlippingGame-${{ env.VERSION }}.jar target/package-input/
          mvn dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/package-input -DskipTests

      - name: Install required packages for RPM
        run: sudo apt-get install -y rpm

      - name: Package for Linux (DEB)
        run: |
          jpackage \
            --input target/package-input \
            --name FlippingGame \
            --main-jar FlippingGame-${{ env.VERSION }}.jar \
            --main-class com.khanhdew.flipping.Launcher \
            --icon src/main/resources/assets/img/icon.png \
            --linux-shortcut \
            --linux-menu-group Game \
            --linux-app-category Game \
            --type deb \
            --app-version ${{ env.VERSION }} \
            --vendor "khanhdew" \
            --description "Flipping Game Application" \
            --dest output/

      - name: Package for Linux (RPM)
        run: |
          jpackage \
            --input target/package-input \
            --name FlippingGame \
            --main-jar FlippingGame-${{ env.VERSION }}.jar \
            --main-class com.khanhdew.flipping.Launcher \
            --icon src/main/resources/assets/img/icon.png \
            --linux-shortcut \
            --linux-menu-group Game \
            --linux-app-category Game \
            --type rpm \
            --app-version ${{ env.VERSION }} \
            --vendor "khanhdew" \
            --description "Flipping Game Application" \
            --dest output/

      - name: Rename packages with version
        run: |
          cd output
          for f in *.deb; do mv "$f" "FlippingGame-${{ env.VERSION }}-linux.deb"; done
          for f in *.rpm; do mv "$f" "FlippingGame-${{ env.VERSION }}-linux.rpm"; done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: output/

  build-windows:
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Project Version
        shell: pwsh
        run: mvn versions:set "-DnewVersion=${{ env.VERSION }}" -DgenerateBackupPoms=false

      - name: Build with Maven and prepare dependencies
        shell: pwsh
        run: |
          mvn clean package -DskipTests
          New-Item -ItemType Directory -Force -Path target/package-input
          Copy-Item target/FlippingGame-${{ env.VERSION }}.jar target/package-input/
          mvn dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/package-input -DskipTests

      - name: Package for Windows (MSI)
        shell: pwsh
        run: |
          jpackage `
            --input target/package-input `
            --name FlippingGame `
            --main-jar FlippingGame-${{ env.VERSION }}.jar `
            --main-class com.khanhdew.flipping.Launcher `
            --type msi `
            --app-version ${{ env.VERSION }} `
            --vendor "khanhdew" `
            --description "Flipping Game Application" `
            --win-menu `
            --win-shortcut `
            --dest output/

      - name: Package for Windows (EXE)
        shell: pwsh
        run: |
          jpackage `
            --input target/package-input `
            --name FlippingGame `
            --main-jar FlippingGame-${{ env.VERSION }}.jar `
            --main-class com.khanhdew.flipping.Launcher `
            --type exe `
            --app-version ${{ env.VERSION }} `
            --vendor "khanhdew" `
            --description "Flipping Game Application" `
            --win-menu `
            --win-shortcut `
            --dest output/

      - name: Rename packages with version
        shell: pwsh
        run: |
          cd output
          Get-ChildItem *.msi | Rename-Item -NewName "FlippingGame-${{ env.VERSION }}-windows.msi"
          Get-ChildItem *.exe | Rename-Item -NewName "FlippingGame-${{ env.VERSION }}-windows.exe"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: output/

  build-macos:
    needs: get-version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Project Version
        run: mvn versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false

      - name: Build with Maven and prepare dependencies
        run: |
          mvn clean package -DskipTests
          mkdir -p target/package-input
          cp target/FlippingGame-${{ env.VERSION }}.jar target/package-input/
          mvn dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/package-input -DskipTests

      - name: Package for macOS (DMG)
        run: |
          jpackage \
            --input target/package-input \
            --name FlippingGame \
            --main-jar FlippingGame-${{ env.VERSION }}.jar \
            --main-class com.khanhdew.flipping.Launcher \
            --type dmg \
            --app-version ${{ env.VERSION }} \
            --vendor "khanhdew" \
            --description "Flipping Game Application" \
            --dest output/

      - name: Package for macOS (PKG)
        run: |
          jpackage \
            --input target/package-input \
            --name FlippingGame \
            --main-jar FlippingGame-${{ env.VERSION }}.jar \
            --main-class com.khanhdew.flipping.Launcher \
            --type pkg \
            --app-version ${{ env.VERSION }} \
            --vendor "khanhdew" \
            --description "Flipping Game Application" \
            --dest output/

      - name: Rename packages with version
        run: |
          cd output
          for f in *.dmg; do mv "$f" "FlippingGame-${{ env.VERSION }}-macos.dmg"; done
          for f in *.pkg; do mv "$f" "FlippingGame-${{ env.VERSION }}-macos.pkg"; done

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: output/

  create-release:
    needs: [get-version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts/ -type f -name "*"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ env.VERSION }}"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ env.VERSION }}" -m "Release v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## FlippingGame v${{ env.VERSION }}
            
            ### Downloads
            
            | Platform | Installer | Package |
            |----------|-----------|---------|
            | 🐧 Linux | DEB | [FlippingGame-${{ env.VERSION }}-linux.deb](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/FlippingGame-${{ env.VERSION }}-linux.deb) |
            | 🐧 Linux | RPM | [FlippingGame-${{ env.VERSION }}-linux.rpm](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/FlippingGame-${{ env.VERSION }}-linux.rpm) |
            | 🪟 Windows | MSI | [FlippingGame-${{ env.VERSION }}-windows.msi](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/FlippingGame-${{ env.VERSION }}-windows.msi) |
            | 🪟 Windows | EXE | [FlippingGame-${{ env.VERSION }}-windows.exe](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/FlippingGame-${{ env.VERSION }}-windows.exe) |
            | 🍎 macOS | DMG | [FlippingGame-${{ env.VERSION }}-macos.dmg](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/FlippingGame-${{ env.VERSION }}-macos.dmg) |
            | 🍎 macOS | PKG | [FlippingGame-${{ env.VERSION }}-macos.pkg](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/FlippingGame-${{ env.VERSION }}-macos.pkg) |
            
            ### System Requirements
            - Java Runtime is bundled in the installer
            - No additional dependencies required
          draft: false
          prerelease: false
          files: |
            artifacts/linux-packages/*
            artifacts/windows-packages/*
            artifacts/macos-packages/*
          fail_on_unmatched_files: false
